<div class="top"><img src="logo.png" class="logoImg" onerror="this.style.display='none'"><div style="font-size:40px">👁️✝️🌈</div><h1>⛪ PROGRAMME DE CULTE</h1><p>PAROISSE JESOUDEGBE D'ABOUABOUT</p><p>PORT BOUET GONZAGUVILLE</p><p class="celeste">EGLISE DU CHRISTIANISME CELESTE</p><p class="tel">📞 TEL : 225 01 72 82 00 46</p></div><div class="wrap">

d="queteS" list="listeNoms" placeholder="Quete"><input id="priereClotS" list="listeNoms" placeholder="Cloture"><textarea id="detailsS" placeholder="Details"></textarea></div><button class="save" onclick="sauver()">✅ ENREGISTRER</button></div>

</div><datalist id="listeNoms"></datalist>
<script>
var CULTES=[{id:"dim10",nom:"Culte Dimanche Matin - 10h",jour:"Dimanche 10h",type:"culte"},{id:"dim19",nom:"Culte du Soir Dimanche - 19h",jour:"Dimanche 19h",type:"priere"},{id:"mer09",nom:"Culte Femmes Steriles - Mercredi 09h",jour:"Mercredi 09h",type:"special"},{id:"mer19",nom:"Culte du Soir Mercredi - 19h",jour:"Mercredi 19h",type:"priere"},{id:"jeu09",nom:"Culte Femmes Enceintes - Jeudi 09h",jour:"Jeudi 09h",type:"special"},{id:"ven13",nom:"Culte Vendredi 13h - Sanctification",jour:"Vendredi 13h",type:"culte"},{id:"ven19",nom:"Culte du Soir Vendredi - 19h",jour:"Vendredi 19h",type:"priere"},{id:"matin06",nom:"Priere du Matin - 06h",jour:"Tous les jours 06h",type:"priere"},{id:"mariage",nom:"Culte de Mariage",jour:"Sur demande",type:"special"},{id:"sortie",nom:"Sortie d Enfant",jour:"Sur demande",type:"special"},{id:"enterrement",nom:"Enterrement",jour:"Sur demande",type:"special"}];
var OFF=[{p:"Conducteur",n:"Vn.Sn.w. Joseph"},{p:"Encensement",n:"Ev. Dominique GNONNINDOU"},{p:"Priere 1",n:"Samuel HIUSSINOU"},{p:"Priere 2",n:"Sn.M. Alice AZONSSI"},{p:"Priere 3",n:"Ev. Dominique GNONNINDOU"},{p:"Lecteur 1",n:"Samuel HIUSSINOU"},{p:"Lecteur 2",n:"Benedicte GBENOU"},{p:"Predication",n:"Papa"},{p:"Quete Homme",n:"un papa"},{p:"Quete Femme",n:"une mama"},{p:"Priere Cloture",n:"Mn GODONOU Mariette"}];
var MEM=[{n:"Benedicte GBENOU",t:""},{n:"Ev. Dominique GNONNINDOU",t:"0173970092"},{n:"Mn GODONOU Mariette",t:""},{n:"Papa",t:""},{n:"Samuel HIUSSINOU",t:""},{n:"Sn.M. Alice AZONSSI",t:""},{n:"Vn.Sn.w. Joseph",t:""}];

if(!data.length)data=[{type:"culte",jour:"Dimanche 10h",nom:"Culte Dimanche Matin - 10h",date:"2026-11-22",theme:"Relation entre la mort et le peche",conducteur:"Vn.Sn.w. Joseph",encensement:"Ev. Dominique GNONNINDOU",p1:"Samuel HIUSSINOU",p2:"Sn.M. Alice AZONSSI",p3:"Ev. Dominique GNONNINDOU",texte1:"1 Samuel 25:32-38",lect1:"Samuel HIUSSINOU",texte2:"Romain 1:24-32",lect2:"Benedicte GBENOU",predication:"Papa",queteH:"un papa",queteF:"une mama",priereClot:"Mn GODONOU Mariette"}];
var culte=null,editI=-1,editF=-1,eventInstall=null;
function $(id){return document.getElementById(id);}
function tri(){MEM.sort(function(a,b){return a.n.toLowerCase().localeCompare(b.n.toLowerCase());});}
function tgl(id){var e=$(id);e.classList.contains("cache")?e.classList.remove("cache"):e.classList.add("cache");if(id==="boxCultes")showCultes();if(id==="boxOff")showOff();}
function v(id){var e=$(id);return e?e.value.trim():"";}
function sv(id,x){var e=$(id);if(e)e.value=x||"";}
function showCultes(){var h="";CULTES.forEach(function(c){h+='<button onclick="choisir(\''+c.id+'\')" style="background:#2563eb;color:#fff;margin-bottom:6px;text-align:left">'+c.nom+'</button>';});$("listeCultes").innerHTML=h;}
function getOff(p){for(var i=0;i<OFF.length;i++)if(OFF[i].p===p)return OFF[i].n;return "";}
function choisir(id){for(var i=0;i<CULTES.length;i++)if(CULTES[i].id===id)culte=CULTES[i];if(!culte)return;$("formBox").style.display="block";$("formTitle").innerText="➕ "+culte.nom;$("partCulte").style.display=culte.type==="culte"?"block":"none";$("partPriere").style.display=culte.type==="priere"?"block":"none";$("partSpecial").style.display=culte.type==="special"?"block":"none";sv("conducteur",getOff("Conducteur"));sv("conducteurP",getOff("Conducteur"));sv("conducteurS",getOff("Conducteur"));sv("encensement",getOff("Encensement"));sv("p1",getOff("Priere 1"));sv("p1P",getOff("Priere 1"));sv("p2",getOff("Priere 2"));sv("p2P",getOff("Priere 2"));sv("p3",getOff("Priere 3"));sv("p3P",getOff("Priere 3"));sv("lect1",getOff("Lecteur 1"));sv("lectP",getOff("Lecteur 1"));sv("lect2",getOff("Lecteur 2"));sv("predication",getOff("Predication"));sv("predicationP",getOff("Predication"));sv("queteH",getOff("Quete Homme"));sv("queteHP",getOff("Quete Homme"));sv("queteF",getOff("Quete Femme"));sv("priereClot",getOff("Priere Cloture"));sv("priereClotP",getOff("Priere Cloture"));$("date").value=new Date().toISOString().slice(0,10);$("boxCultes").classList.add("cache");window.scrollTo(0,0);}
function add1(){var nom=v("nn");if(!nom){alert("Mets le nom");return;}var ex=false;MEM.forEach(function(m){if(m.n.toLowerCase()===nom.toLowerCase())ex=true;});if(!ex){MEM.push({n:nom,t:v("nt")});tri();localStorage.setItem("memF",JSON.stringify(MEM));}sv("nn","");sv("nt","");showFid();showOff();alert("Fidele ajoute: "+nom);}
function addMasse(){var t=$("nmasse").value;if(!t.trim()){alert("Colle d'abord les noms");return;}var n=0;t.split("\n").forEach(function(l){var nom=l.trim();if(nom.length<2)return;var ex=false;MEM.forEach(function(m){if(m.n.toLowerCase()===nom.toLowerCase())ex=true;});if(!ex){MEM.push({n:nom,t:""});n++;}});tri();localStorage.setItem("memF",JSON.stringify(MEM));$("nmasse").value="";showFid();showOff();alert(n+" fideles ajoutes !");}
function showFid(){tri();var r=(v("rechF")||"").toLowerCase();var h="",L="";MEM.forEach(function(m,i){if(r&&m.n.toLowerCase().indexOf(r)<0)return;var c=m.n.charAt(0).toUpperCase();if(c!==L){L=c;h+='<div style="background:#0f766e;color:#fff;padding:4px 8px;border-radius:6px;font-weight:900;margin-top:8px">'+L+'</div>';}h+='<div class="row"><b>'+m.n+' '+(m.t?"- "+m.t:"")+'</b><button onclick="editFid('+i+')" style="background:#f59e0b">✏️ Modifier</button><button onclick="delFid('+i+')" style="background:#fee2e2;color:#b91c1c">🗑️</button></div>';});$("listeFid").innerHTML=h||"Aucun fidele";$("nb").innerText=MEM.length;var dl=$("listeNoms");dl.innerHTML="";MEM.forEach(function(m){var o=document.createElement("option");o.value=m.n;dl.appendChild(o);});}
function editFid(i){editF=i;$("boxEdit").style.display="block";sv("editAncien",MEM[i].n);sv("editNouveau",MEM[i].n);sv("editTel",MEM[i].t);$("boxEdit").scrollIntoView();}
function validerEdit(){if(editF<0)return;var nv=v("editNouveau");if(!nv){alert("Mets le nouveau nom");return;}var anc=MEM[editF].n;MEM[editF].n=nv;MEM[editF].t=v("editTel");OFF.forEach(function(o){if(o.n===anc)o.n=nv;});tri();localStorage.setItem("memF",JSON.stringify(MEM));localStorage.setItem("offF",JSON.stringify(OFF));editF=-1;$("boxEdit").style.display="none";showFid();showOff();alert("Corrige: "+anc+" -> "+nv);}
function delFid(i){if(confirm("Supprimer "+MEM[i].n+" ?")){MEM.splice(i,1);localStorage.setItem("memF",JSON.stringify(MEM));showFid();showOff();}}
function showOff(){var h="";OFF.forEach(function(o,i){h+='<div class="row"><b>'+o.p+'</b><select id="off-'+i+'" style="flex:1">';MEM.forEach(function(m){h+='<option '+(m.n===o.n?"selected":"")+'>'+m.n+'</option>';});h+='<option value="">-- Vide --</option></select><button onclick="remp('+i+')" style="background:#f59e0b">Remplacer</button></div>';});$("listeOff").innerHTML=h;}
function remp(i){var s=$("off-"+i);OFF[i].n=s.value;localStorage.setItem("offF",JSON.stringify(OFF));showOff();alert("Remplace: "+OFF[i].p+" = "+s.value);}
function sauver(){if(!culte){alert("Choisis d'abord un culte");return;}var th=v("theme");if(!th){alert("Mets le theme");return;}var o={type:culte.type,jour:culte.jour,nom:culte.nom,date:v("date"),theme:th,conducteur:v("conducteur"),encensement:v("encensement"),p1:v("p1"),p2:v("p2"),p3:v("p3"),texte1:v("texte1"),lect1:v("lect1"),texte2:v("texte2"),lect2:v("lect2"),predication:v("predication"),queteH:v("queteH"),queteF:v("queteF"),priereClot:v("priereClot"),conducteurP:v("conducteurP"),p1P:v("p1P"),p2P:v("p2P"),p3P:v("p3P"),texteP:v("texteP"),lectP:v("lectP"),predicationP:v("predicationP"),queteHP:v("queteHP"),priereClotP:v("priereClotP"),conducteurS:v("conducteurS"),concerneS:v("concerneS"),p1S:v("p1S"),p2S:v("p2S"),texteS:v("texteS"),lectS:v("lectS"),predicationS:v("predicationS"),queteS:v("queteS"),priereClotS:v("priereClotS"),detailsS:v("detailsS")};if(editI>=0){data[editI]=o;editI=-1;}else data.unshift(o);localStorage.setItem("progF",JSON.stringify(data));$("formBox").style.display="none";alert("Enregistre: "+o.nom);afficher();}

function modif(i){var c=data[i];editI=i;for(var k=0;k<CULTES.length;k++)if(CULTES[k].nom===c.nom)culte=CULTES[k];if(!culte)culte={type:c.type,nom:c.nom,jour:c.jour};$("formBox").style.display="block";$("formTitle").innerText="Modifier: "+c.nom;$("partCulte").style.display=c.type==="culte"?"block":"none";$("partPriere").style.display=c.type==="priere"?"block":"none";$("partSpecial").style.display=c.type==="special"?"block":"none";sv("date",c.date);sv("theme",c.theme);["conducteur","encensement","p1","p2","p3","texte1","lect1","texte2","lect2","predication","queteH","queteF","priereClot","conducteurP","p1P","p2P","p3P","texteP","lectP","predicationP","queteHP","priereClotP","conducteurS","concerneS","p1S","p2S","texteS","lectS","predicationS","queteS","priereClotS","detailsS"].forEach(function(id){sv(id,c[id]);});window.scrollTo(0,0);}
